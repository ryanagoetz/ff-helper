# A generic 12-team auction for testing the bridge against a mock draft.
#
# The team names are placeholders on purpose. Buyers the app has never seen claim a free
# slot as they appear, so the money still leaves the room and inflation stays honest --
# which is the number that prices everything. Only "Your Team" is pinned, because your own
# budget and max bid are not a display detail.
#
#   uv run ff-helper --offline data/league-mock.yaml --bridge
#
# Throwaway. Do not draft your real league against this.

name: Mock Draft
league_id: "mock"
season: "2026"
num_teams: 12
draft_type: auction
auction_budget: 200

# Borrow the real league's player pool rather than rebuilding an identical one.
snapshot_league_key: "offline.l.107878"

roster:
  QB: 1
  WR: 2
  RB: 2
  TE: 1
  W/R/T: 1
  K: 1
  DEF: 1
  BN: 6

scoring:
  pass_yds: 0.04
  pass_td: 4
  int: -1
  rush_yds: 0.1
  rush_td: 6
  rec: 0.5
  rec_yds: 0.1
  rec_td: 6
  fum_lost: -2

# Yahoo calls your own team "Your Team" in the draft room.
my_team: "Your Team"
teams:
  - "Your Team"
  - "Rival 2"
  - "Rival 3"
  - "Rival 4"
  - "Rival 5"
  - "Rival 6"
  - "Rival 7"
  - "Rival 8"
  - "Rival 9"
  - "Rival 10"
  - "Rival 11"
  - "Rival 12"
