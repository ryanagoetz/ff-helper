# Example offline league description -- copy this and edit it for your own league.
#
# Used when the Yahoo API is unavailable. Everything here normally comes from the API;
# offline it comes from you. Transcribe it from the league's Scoring & Settings page.
#
#   uv run python scripts/fetch_rankings.py --offline data/league-mine.yaml
#   uv run ff-helper --offline data/league-mine.yaml

name: My League
league_id: "000000"
season: "2026"
num_teams: 12
draft_type: auction

# Not shown on the settings page. Yahoo's default is 200 -- confirm it on the draft page,
# because every dollar value in the app scales off this number.
auction_budget: 200

# Roster Positions: QB, WR, WR, RB, RB, TE, W/R/T, K, DEF, BN x6, IR
# IR is excluded from roster_size automatically, so this is 15 draftable spots.
roster:
  QB: 1
  WR: 2
  RB: 2
  TE: 1
  W/R/T: 1
  K: 1
  DEF: 1
  BN: 6
  IR: 1

# Yahoo states yardage as "25 yards per point"; this wants points per yard, so 1/25 = 0.04.
scoring:
  pass_yds: 0.04     # 25 yards per point
  pass_td: 4
  int: -1
  rush_yds: 0.1      # 10 yards per point
  rush_td: 6
  rec: 0.5           # half PPR
  rec_yds: 0.1       # 10 yards per point
  rec_td: 6
  ret_td: 6
  two_pt: 2
  fum_lost: -2

# Scored by the league but not scoreable here, listed so the gap is on the record rather
# than a surprise: return yards (50 yds/pt), offensive fumble return TD (6), pick sixes
# thrown (-1), all kicker scoring (FG by distance, PAT), and all DEF/ST scoring (sacks,
# turnovers, safeties, blocks, points-allowed tiers). Kickers and defenses are ranked by
# consensus instead of projection, which is the same thing the online path does.

# Draft-room spellings that differ from the names above. Only buyers need these: an
# unresolved buyer leaves its money in the room and overstates every price the app quotes,
# where an unresolved player is merely a sale the board misses. Fill these in from the
# draft room if it shows anything different -- your own team especially, since a mismatch
# there corrupts max bid.
team_aliases: {}
#  "My Team Name...": "My Team Name"

# Team names as of the date you transcribed this. They can change up to the draft; if one
# does, edit it here and in any keeper CSV, since both match on the name.
#
# In a SNAKE league the order of this list is the draft order -- slot 1 first -- and every
# pick's owner is derived from it. Put your own team where you actually draft from. An
# auction has no pick order, so the order is free there.
my_team: "My Team"
teams:
  - "Team 1"
  - "Team 2"
  - "Team 3"
  - "Team 4"
  - "Team 5"
  - "Team 6"
  - "Team 7"
  - "My Team"
  - "Team 9"
  - "Team 10"
  - "Team 11"
  - "Team 12"
